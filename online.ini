# Modo online (ciudad). El juego lo lee al conectarse.
# servidor: IP o nombre del PC donde esta abierto "Servidor online.cmd" (127.0.0.1 = este PC).
servidor=127.0.0.1
# puerto del servidor web de Nintendo emulado (servidor_wfc.py --nas)
puerto_nas=9000
# 1 = apunta en el registro cada envio y recepcion de red
registro_detallado=0
# 1 = el juego abre solo los servidores de este equipo al entrar en el online (sin ventanas;
#     se cierran al salir). 0 = abrirlos a mano con "Servidor online.cmd".
arrancar_servidores=1
